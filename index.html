<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_FORGE // STELLAR INTELLIGENCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030508;
            --bg-space: linear-gradient(135deg, #030508 0%, #080c14 50%, #0d071a 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-blue: #00f2fe; 
            --neon-purple: #4facfe; 
            --neon-green: #00ffcc; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-dark);
            background: var(--bg-space);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            line-height: 1.8;
        }

        /* 背景レイヤー */
        .background-layers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #star-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .grid-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center;
            transform: perspective(500px) rotateX(60deg) translateY(-100px);
            transform-origin: top center;
            opacity: 0.5;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ガラスモルフィズムヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-family: 'Share Tech Mono', monospace;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-main);
            text-decoration: none;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2.5rem;
            transition: all 0.3s;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        /* ヒーロー */
        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-tag {
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 242, 254, 0.1);
            color: var(--neon-blue);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 2rem;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .hero-title {
            font-size: clamp(2.2rem, 6vw, 5.5rem);
            font-weight: 200;
            line-height: 1.15;
            letter-spacing: -2px;
            margin-bottom: 2.5rem;
        }

        .hero-title strong {
            font-weight: 700;
            background: linear-gradient(120deg, var(--text-main) 30%, var(--neon-blue) 70%, var(--neon-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .typing-container {
            display: inline-block;
            min-width: 280px;
            text-align: left;
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            border-right: 2px solid var(--neon-green);
            animation: blink 0.75s step-end infinite;
        }

        .hero-desc {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 3.5rem;
            font-weight: 400;
        }

        .cta-btn {
            display: inline-block;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            color: #000;
            font-weight: 700;
            padding: 1.2rem 3rem;
            font-size: 1rem;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.3);
        }

        .cta-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 242, 254, 0.6);
            color: #fff;
        }

        /* セクション */
        .section {
            padding: 10rem 0;
            opacity: 0;
            transform: translateY(60px);
            transition: all 1.2s cubic-bezier(0.215, 0.610, 0.355, 1);
        }

        .section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-num {
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-blue);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
            text-align: center;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 200;
            text-align: center;
            margin-bottom: 5rem;
            letter-spacing: 1px;
        }

        /* グリッド */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 3rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 3rem 2.5rem;
            border-radius: 16px;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card-tag {
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-blue);
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 242, 254, 0.05);
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.8;
        }

        /* お問い合わせ */
        .contact-box {
            max-width: 650px;
            margin: 0 auto;
            background: rgba(5, 8, 15, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4rem 3.5rem;
            border-radius: 24px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.7);
        }

        .form-group {
            margin-bottom: 2.5rem;
        }

        .form-group label {
            display: block;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: var(--neon-blue);
            margin-bottom: 0.7rem;
            letter-spacing: 2px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.2rem;
            color: var(--text-main);
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            background: rgba(0, 242, 254, 0.01);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .form-submit {
            width: 100%;
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 1.2rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 700;
        }

        .form-submit:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
        }

        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding: 4rem 0;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: var(--neon-green); }
        }

        @media (max-width: 768px) {
            .container { padding: 0 1.5rem; }
            .hero { padding: 8rem 0; }
            .contact-box { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="background-layers">
        <canvas id="star-canvas"></canvas>
        <div class="grid-layer"></div>
    </div>

    <div class="container">
        <header>
            <a href="#" class="logo">STELLAR_AI</a>
            <nav>
                <a href="#projects">ARCHIVE</a>
                <a href="#contact">CONTACT</a>
            </nav>
        </header>

        <main>
            <section class="hero">
                <div class="hero-tag">// QUANTUM INTELLIGENCE LABORATORY</div>
                <h1 class="hero-title">
                    AIを駆使したあらゆる<br>
                    <strong><span class="typing-container" id="typed-target"></span></strong>
                </h1>
                <p class="hero-desc">
                    澄み切った星空のように、複雑なノイズから本質を見つけ出す。金融工学、行政自動
