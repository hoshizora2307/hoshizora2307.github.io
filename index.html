<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STELLAR_AI | Quantum Intelligence Laboratory</title>
    <style>
        /* 根幹となるサイバー・ミニマリズムなダークテーマ設定 */
        :root {
            --bg-color: #030708;
            --accent-color: #5ff2d6; /* 特徴的なネオンミント */
            --text-primary: #ffffff;
            --text-secondary: #8a99ad;
            --border-color: rgba(95, 242, 214, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景動画エリア（画面全体に固定・最背面） */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: cover;
            pointer-events: none;
            opacity: 0.6; /* 動画の明るさを抑えて文字を読みやすく調整 */
        }

        /* 動画の上のオーバーレイ（暗色のグラデーションで文字の視認性をさらに強化） */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: radial-gradient(circle at 50% 35%, rgba(3, 7, 8, 0.2) 0%, var(--bg-color) 80%);
            pointer-events: none;
        }

        /* 固定ヘッダー */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(95, 242, 214, 0.3);
        }

        nav {
            display: flex;
            gap: 32px;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        /* メインコンテンツエリア */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px 120px;
            max-width: 680px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* サブバッジ（ラボ表記） */
        .badge {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.25em;
            color: var(--accent-color);
            background: rgba(3, 7, 8, 0.6); /* 背面の動画が透けても見やすいよう暗く設定 */
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            margin-bottom: 48px;
            text-transform: uppercase;
            border-radius: 2px;
            backdrop-filter: blur(4px); /* グラスモルフィズム効果 */
        }

        /* メインコピー */
        h1 {
            font-size: 36px;
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 1.4;
            margin-bottom: 40px;
            color: var(--text-primary);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* メイン説明文 */
        .description {
            font-size: 14px;
            line-height: 2;
            color: var(--text-secondary);
            letter-spacing: 0.08em;
            margin-bottom: 56px;
            text-align: justify;
            text-justify: inter-character;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.8);
        }

        /* ローンチボタン */
        .btn-launch {
            display: inline-block;
            background-color: var(--text-primary);
            color: #000000;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15em;
            padding: 18px 48px;
            border-radius: 2px;
            transition: opacity 0.3s ease, transform 0.2s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-launch:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* モバイル端末への完全レスポンシブ最適化 */
        @media (max-width: 480px) {
            header {
                padding: 24px 20px;
            }
            .logo {
                font-size: 18px;
            }
            nav {
                gap: 20px;
            }
            .badge {
                font-size: 10px;
                padding: 10px 16px;
                margin-bottom: 40px;
                width: 100%;
            }
            h1 {
                font-size: 26px;
                line-height: 1.5;
            }
            .description {
                font-size: 13px;
                line-height: 1.8;
                margin-bottom: 48px;
            }
            .btn-launch {
                width: 100%;
                padding: 16px 0;
            }
        }
    </style>
</head>
<body>

    <video class="video-background" autoplay loop muted playsinline>
        <source src="1331.mp4" type="video/mp4">
    </video>
    
    <div class="video-overlay"></div>

    <header>
        <a href="#" class="logo">STELLAR_AI</a>
        <nav>
            <a href="#">Archive</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="badge">
            // Quantum Intelligence Laboratory
        </div>

        <h1>AIを駆使したあらゆる</h1>

        <p class="description">
            澄み切った星空のように、複雑なノイズから本質を見出す。金融工学、行政自動化、自然科学計算モデルを実装するプログラミングスタジオ。
        </p>

        <a href="#" class="btn-launch">Launch Project</a>
    </main>

</body>
</html>
